[project]
name = "earnings-vol-study"
version = "0.1.0"
description = "An event study of how earnings announcements move options implied volatility."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "yfinance==1.7.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_vol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "pytest==9.2.0",
]
