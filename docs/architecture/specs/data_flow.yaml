# Column-level data flow: which source columns feed which derived table, ending
# at the JSON view files. Follows the "Lineage / meaning" columns of
# docs/architecture/data-model.md section 3 and the "Built from" column of section 4, and the
# layer table of ADR 0001 section 1 (who writes and who reads each table).
# Dashed edges are inputs that are local only (class R, never committed) or validation-only, the
# one same-layer feed from eps back to events (match_status -> orphan_nearby), which the fixed
# order inside the events layer makes legal (README notes), or the SEC EDGAR input (ADR 0002:
# accepted 2026-10-28, gated on the owner's contact string: the client refuses to run until
# SEC_EDGAR_USER_AGENT is set, so the edge carries nothing yet and the rule in force is the press
# release, then the calendar label). timing_check never sets a label: it triggers a second reading
# (daily/mixed) or a look-up (coarse) of the press release, and feeds the sample funnel's by-tercile share.
# The DoltHub tables are not queried in the shared clones. ingest/dolt.py copies each clone to a
# private mirror, $VOL_DATA_DIR/earnings-vol-study/cache/dolt_mirror/{earnings,options}, and runs
# `dolt sql -r parquet` (SELECT only, AS OF the commits pinned in params.yaml) there, because a
# SELECT rewrites a clone's files on dolt 2.6.1. s_mirror is that copy.
# The press-release look-ups are recorded in the committed file data/manual/press_release_checks.csv.
# There is no iv_daily -> events edge any more: eligible_* moved to event_measures, and
# events.sample / orphan_nearby need no IV data (ADR 0001 section 1).
# No lanes: with lanes the layout stacks sources and JSON files into tall bands and
# the diagram doubles in size; the top-to-bottom order already shows the stages.
kind: flow
title: Earnings vol study data flow
subtitle: Source columns to derived tables to JSON view files (data-model.md lineage)
direction: TB

nodes:
  # --- Source columns ------------------------------------------------------
  - {id: s_mirror, label: Dolt mirrors (private copies), sublabel: "cache/dolt_mirror; dolt sql -r parquet", type: store}
  - {id: s_cal,    label: earnings_calendar, sublabel: "act_symbol, date, when",            type: source}
  - {id: s_eps,    label: eps_history,       sublabel: "period_end_date, reported, estimate", type: source}
  - {id: s_est,    label: eps_estimate,      sublabel: "date, period, consensus, high, low", type: source}
  - {id: s_chain,  label: option_chain,      sublabel: "date, expiration, strike, bid, ask", type: source}
  - {id: s_vol,    label: volatility_history, sublabel: "iv_current",                      type: source}
  - {id: s_sp,     label: S&P 500 list,      sublabel: "name, GICS sector, sub-industry",   type: external}
  - {id: s_xnys,   label: exchange_calendars, sublabel: "XNYS sessions, half days",         type: external}
  - {id: s_fred,   label: FRED,              sublabel: "DTB3, VIXCLS",                      type: external}
  - {id: s_yf,     label: yfinance,          sublabel: "Open, Close, shares (local only)",  type: external}
  - {id: s_vx,     label: CBOE VX*,          sublabel: "VXAPL ... VXIBM closes",            type: external}
  - {id: s_pr,     label: press releases,    sublabel: "IR time stamp, in press_release_checks.csv", type: external}
  - {id: s_edgar,  label: SEC EDGAR 8-K (accepted), sublabel: "acceptanceDateTime; gated on contact string", type: external}

  # --- Reference tables (events layer) -------------------------------------
  - {id: t_security, label: security,     sublabel: "PK security_id",              type: store}
  - {id: t_alias,    label: ticker_alias, sublabel: "PK ticker, valid_from",       type: store}
  - {id: t_session,  label: session,      sublabel: "PK session_date, session_index", type: store}
  - {id: t_market,   label: market_daily, sublabel: "r_cont, ln_vix_cboe (events layer)", type: store}
  - {id: t_timing,   label: timing_check, sublabel: "gap_verdict_yf, outside_flag_yf", type: store}

  # --- Events and EPS (events layer) ---------------------------------------
  - {id: t_events,   label: events,       sublabel: "PK event_id, timing_source, day0_session", type: store}
  - {id: t_eps,      label: eps,          sublabel: "surprise, consensus, event_id", type: store}

  # --- Chain and IV (measures layer) ---------------------------------------
  - {id: t_chain,    label: chain_expiry, sublabel: "forward, w_atm, tau",         type: store}
  - {id: t_iv,       label: iv_daily,     sublabel: "cm30_iv, event_var, sigma_d_iv", type: store}
  - {id: t_snap,     label: session_snapshot, sublabel: "snapshot_status (milestone 1)", type: store}

  # --- Panel layer ---------------------------------------------------------
  - {id: t_ewo,      label: event_window_obs, sublabel: "rel_day, aliv_mean_adj, in_baseline", type: store}
  - {id: t_em,       label: event_measures,   sublabel: "crush, runup, persist, price_ref, eligible_*", type: store}
  - {id: t_vx,       label: event_measures_vx, sublabel: "cboe5 members, local only", type: store}

  # --- Results (stats layer) -----------------------------------------------
  - {id: t_results,  label: results,      sublabel: "statistic, estimand, n_clusters_firm, p_holm", type: store}

  # --- JSON view files -----------------------------------------------------
  - {id: j_meta,     label: meta.json,                type: output}
  - {id: j_funnel,   label: sample_funnel.json,       type: output}
  - {id: j_paths,    label: event_paths.json,         type: output}
  - {id: j_heat,     label: heatmap.json,             type: output}
  - {id: j_terrain,  label: terrain.json,             type: output}
  - {id: j_ivr,      label: implied_vs_realised.json, type: output}
  - {id: j_tests,    label: tests.json,               type: output}
  - {id: j_drivers,  label: drivers.json,             type: output}
  - {id: j_valid,    label: validation.json,          type: output}

edges:
  # Dolt mirror -> the DoltHub tables it serves
  - {from: s_mirror, to: s_cal,   label: "copy of the clone"}
  - {from: s_mirror, to: s_eps}
  - {from: s_mirror, to: s_est}
  - {from: s_mirror, to: s_chain}
  - {from: s_mirror, to: s_vol}

  # Source -> reference tables
  - {from: s_sp,       to: t_security, label: "name, GICS"}
  - {from: s_xnys,     to: t_session,  label: sessions}
  - {from: s_fred,     to: t_market,   label: "DTB3, VIXCLS"}
  - {from: t_session,  to: t_market,   label: session_date}
  - {from: s_cal,      to: t_alias,    label: act_symbol}
  - {from: t_security, to: t_alias,    label: security_id}
  - {from: s_yf,       to: t_timing,   label: "Open, Close, SPY", style: dashed}

  # -> events
  - {from: s_cal,     to: t_events, label: "date, when"}
  - {from: t_alias,   to: t_events, label: security_id}
  - {from: t_session, to: t_events, label: "day0, day-1"}
  - {from: s_pr,      to: t_events, label: "timing (hand check)"}
  - {from: s_edgar,   to: t_events, label: "edgar_accepted_utc", style: dashed}
  - {from: t_timing,  to: t_events, label: "trigger: second reading or look-up", style: dashed}
  - {from: t_eps,     to: t_events, label: "match_status to orphan_nearby", style: dashed}

  # -> chain_expiry, iv_daily
  - {from: s_chain,   to: t_chain, label: "bid, ask, strike, vol"}
  - {from: t_alias,   to: t_chain, label: security_id}
  - {from: t_session, to: t_chain, label: tau_sessions}
  - {from: t_market,  to: t_chain, label: r_cont to df}
  - {from: t_events,  to: t_chain, label: next_event_id}
  - {from: t_chain,   to: t_iv,    label: "w_atm, forward, tau"}
  - {from: t_events,  to: t_iv,    label: "next / prev event"}
  - {from: s_vol,     to: t_iv,    label: iv_current, style: dashed}

  # -> session_snapshot (measures layer, milestone 1; folded into iv_daily at milestone 2)
  - {from: s_chain,   to: t_snap,  label: "date, act_symbol"}
  - {from: t_alias,   to: t_snap,  label: security_id}
  - {from: t_session, to: t_snap,  label: session_date}

  # -> eps
  - {from: s_eps,   to: t_eps, label: "reported, estimate"}
  - {from: s_est,   to: t_eps, label: "consensus, high, low"}
  - {from: t_alias, to: t_eps, label: security_id}
  - {from: t_events, to: t_eps, label: "event_id, lag_days"}

  # -> panel: event_window_obs, event_measures, event_measures_vx
  - {from: t_events, to: t_ewo, label: "rel_day, baseline zones"}
  - {from: t_session, to: t_ewo, label: session_date}
  - {from: t_iv,     to: t_ewo, label: "cm30_iv, sigma_d_iv, event_var"}
  - {from: t_chain,  to: t_ewo, label: "front_fixed_iv (T1*)"}
  - {from: t_market, to: t_ewo, label: ln_vix_cboe, style: dashed}
  - {from: s_vx,     to: t_ewo, label: ln_vx_cboe, style: dashed}
  - {from: t_ewo,    to: t_em,  label: "aliv, e_abn, baseline"}
  - {from: t_iv,     to: t_em,  label: "event_var, front_expiry, ts_slope"}
  - {from: t_chain,  to: t_em,  label: "forward x df (price_ref, realised)"}
  - {from: t_events, to: t_em,  label: "exclusion_reason (eligible_*)"}
  - {from: t_eps,    to: t_em,  label: "surprise (surprise_scaled, SUE)"}
  - {from: t_market, to: t_em,  label: vix_regime, style: dashed}
  - {from: s_yf,     to: t_em,  label: "close, shares (local)", style: dashed}
  - {from: t_ewo,    to: t_vx,  label: "ln_vx_cboe, e_abn_vx_cboe", style: dashed}
  - {from: t_security, to: t_vx, label: cboe_vx_index, style: dashed}
  - {from: t_events, to: t_vx,  label: exclusion_reason, style: dashed}

  # -> results
  - {from: t_em,  to: t_results, label: "crush, runup, persist, E"}
  - {from: t_ewo, to: t_results, label: aliv path}
  - {from: t_vx,  to: t_results, label: "cboe5 rows (all only)", style: dashed}
  - {from: t_eps, to: t_results, label: "dispersion, signed surprise"}
  - {from: t_events, to: t_results, label: "sample, timing, season labels"}
  - {from: t_security, to: t_results, label: sector}
  - {from: t_iv,  to: t_results, label: cm30_blind_iv, style: dashed}
  - {from: t_chain, to: t_results, label: vendor_iv_atm, style: dashed}
  - {from: s_vx,  to: t_results, label: "VX* closes (stats only)", style: dashed}

  # -> JSON view files
  - {from: t_events,  to: j_meta,   label: n_events}
  - {from: t_events,  to: j_funnel, label: "timing_status, gap_check_changed, exclusion_reason, sample"}
  - {from: t_em,      to: j_funnel, label: "eligible_*, abs_move_cand_max terciles, crush_mean_adj"}
  - {from: t_timing,  to: j_funnel, label: "gap_verdict_yf share by tercile", style: dashed}
  - {from: t_snap,    to: j_funnel, label: "observed sessions (baseline step)"}
  - {from: t_ewo,     to: j_paths,  label: per-event aliv_mean_adj}
  - {from: t_results, to: j_paths,  label: aliv_path}
  - {from: t_em,      to: j_heat,   label: crush_mean_adj by season}
  - {from: t_results, to: j_heat,   label: BH q}
  - {from: t_ewo,     to: j_terrain, label: mean aliv_mean_adj by security}
  - {from: t_security, to: j_terrain, label: "ticker, sector"}
  - {from: t_em,      to: j_ivr,    label: "event_var, realized_ret_0, surprise_scaled"}
  - {from: t_results, to: j_ivr,    label: H7 regression}
  - {from: t_results, to: j_tests,  label: "event_test: estimand, n_clusters_firm"}
  - {from: t_results, to: j_drivers, label: "regression: n_clusters_season"}
  - {from: t_results, to: j_valid,  label: family validation}
