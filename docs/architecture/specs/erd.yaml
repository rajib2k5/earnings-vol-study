# Entity-relationship diagram of every stored table (data-model.md section 3) plus the
# Python -> app JSON contract files (section 4). Keys and cardinalities follow section 5
# (R1-R21; R4, R7 and R14 are retired and not drawn).
#
# Kit limits that shaped this file (also listed in docs/architecture/README.md):
#  - the kit rejects self-referencing foreign keys, so events.prev_event_id / next_event_id
#    (R18a/b) are plain nullable columns here and have no line;
#  - one fk target per column and no composite FKs. R11 is the composite FK
#    (security_id, session_date) of chain_expiry to iv_daily; it is drawn as two lines, one per
#    column ("R11 (1/2)" and "R11 (2/2)"). R12a-e are composite FKs (security_id, session_date,
#    role column) of iv_daily to chain_expiry; each is drawn as ONE line from the role column to
#    chain_expiry.expiration, and the security_id / session_date parts are not drawn because those
#    two columns already carry their own FK (to security and session);
#  - enum member lists, unique constraints (session.session_index, eps.event_id) and the
#    "not a key" note on events.fiscal_period_end cannot be drawn: the type is just `enum`;
#  - R11 and R12 make iv_daily and chain_expiry reference each other, which the kit draws as two
#    separate groups of lines between the same pair of tables;
# Column names carry the licensing suffix (_yf, _cboe) exactly as in the data model, so a reader can
# see which columns never leave the machine. The tables committed to data/derived are drawn in full;
# drop the suffixed columns to get the committed shape.
# JSON entities: `kind` is the file stem. Their columns are the top-level keys of `data`; nested
# fields (tests.rows[].estimand, drivers.models[].n_clusters_season, ...) are listed in data-model
# section 4. The from_* columns are lineage links, not stored foreign keys: they join a file to the
# table(s) it is exported from, and carry no cardinality meaning. A type ending in _planned marks a
# key or link that arrives with schema 0.2.0 and does not exist in today's meta.json.
# events.edgar_accession / edgar_accepted_utc exist only if the owner approves SEC EDGAR (ADR 0002:
# Proposed: pending owner decision). A column cannot carry a note in the kit, so the events entity
# label says it.
