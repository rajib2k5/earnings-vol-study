relations:
  # section 3 / 5 relationships between stored tables. The R-number in each label is the row of
  # data-model section 5, so erd.mmd can be compared with that table line by line.
  - {from: ticker_alias.security_id, to: security.security_id, cardinality: "1..*", label: "R1 known as"}
  - {from: events.security_id, to: security.security_id, cardinality: "0..*", label: "R2 announces"}
  - {from: eps.security_id, to: security.security_id, cardinality: "0..*", label: "R3 reports"}
  - {from: iv_daily.security_id, to: security.security_id, cardinality: "0..*", label: "R5 has"}
  - {from: market_daily.session_date, to: session.session_date, cardinality: "0..1", label: "R6 has"}
  - {from: iv_daily.session_date, to: session.session_date, cardinality: "0..*", label: "R8 on"}
  - {from: events.day0_session, to: session.session_date, cardinality: "0..*", label: "R9a day 0"}
  - {from: events.day_m1_session, to: session.session_date, cardinality: "0..*", label: "R9b day -1"}
  - {from: event_window_obs.session_date, to: session.session_date, cardinality: "0..*", label: "R10 on"}
  - {from: chain_expiry.security_id, to: iv_daily.security_id, cardinality: "0..*", label: "R11 (1/2) expiries of snapshot"}
  - {from: chain_expiry.session_date, to: iv_daily.session_date, cardinality: "0..*", label: "R11 (2/2) expiries of snapshot"}
